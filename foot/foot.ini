# foot 1.28 config for CDE terminals; carries the look of ../ghostty/config.
# Linked to ~/.config/foot/foot.ini by link.sh. Check with: foot --check-config -c foot.ini
#
# Fonts: ghostty forced the regular face for bold/italic; foot derives real bold/italic/
# bold-italic faces of the same family instead (font-bold/font-italic unset = auto).

font=Bitstream Vera Sans Mono:size=14
# CDE handles per-output scale itself; keep the point size literal like ghostty.
dpi-aware=no
# Default padding (ghostty window-padding 2x2); CDE overrides it per pane via
# `-o pad={gap}x{gap} center` in the host's tiling terminal-args.
pad=2x2 center

[scrollback]
# foot counts lines (ghostty's 10240 was bytes): 10000 lines of history.
lines=10000

[cursor]
style=block
blink=yes

[colors-dark]
# ghostty background-opacity = 0.8 (the old urxvt cccc alpha)
alpha=0.8
foreground=c5c8c6
background=000000
cursor=000000 c5c8c6
regular0=282a2e
regular1=a54242
regular2=649440
regular3=de935f
regular4=5f819d
regular5=85678f
regular6=5e8d87
regular7=707880
bright0=373b41
bright1=cc6666
bright2=8abd68
bright3=f0c674
bright4=81a2be
bright5=b294bb
bright6=8abeb7
bright7=c5c8c6

[key-bindings]
# A foot-native set: foot's defaults are kept unless listed here. None of foot's defaults use
# Super, so nothing collides with CDE's Super-chords; the overlays (picker/launcher/keys) own
# Escape, which foot does not bind. Kept defaults, for reference:
#   clipboard-copy  Control+Shift+c XF86Copy     clipboard-paste  Control+Shift+v XF86Paste
#   primary-paste   Shift+Insert                 search-start     Control+Shift+r
#   font-increase   Control+plus/equal/KP_Add    font-decrease    Control+minus/KP_Subtract
#   font-reset      Control+0/KP_0               scrollback       Shift+Page_Up / Shift+Page_Down
#   show-urls-launch Control+Shift+o (URL mode)  prompt-prev/next Control+Shift+z / Control+Shift+x
#   unicode-input   Control+Shift+u
# CDE owns window creation (run-terminal / split-*): a foot-spawned window would open
# outside the pane model, so drop foot's own new-window binding.
spawn-terminal=none
# Scrollback jumps the defaults leave unbound.
scrollback-home=Shift+Home
scrollback-end=Shift+End
